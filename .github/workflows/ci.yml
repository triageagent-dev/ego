name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushing a fixup doesn't
# waste minutes finishing a build that's about to be re-run anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # ui/embed.go's go:embed all:dist needs ui/dist populated before any
      # `go build`/`vet`/`test` that touches the ui package - see
      # CONTRIBUTING.md's dev setup, which documents this exact order.
      - name: Build UI (required before any Go build)
        run: npm ci && npm run build
        working-directory: ui

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt (fails if any file is unformatted)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./...

  ui:
    name: UI lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      # The UI is not lint-clean under the current eslint config yet: report lint issues without failing CI.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

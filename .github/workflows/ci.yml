name: CI

# Manual only: the included Actions minutes ran out, so nothing runs on a push. `make test`, `go vet ./...` and
# `gofmt -l .` are the gate; scripts/release-local.sh runs them before it publishes.
on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so pushing a fixup doesn't
# waste minutes finishing a build that's about to be re-run anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # ui/embed.go's go:embed all:dist needs ui/dist populated before any
      # `go build`/`vet`/`test` that touches the ui package - see
      # CONTRIBUTING.md's dev setup, which documents this exact order.
      - name: Build UI (required before any Go build)
        run: npm ci && npm run build
        working-directory: ui

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt (fails if any file is unformatted)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./...

  ui:
    name: UI lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      # The UI is not lint-clean under the current eslint config yet: report lint issues without failing CI.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  docker:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vuln:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    # Reports known vulnerabilities in the call graph; not a gate yet, a finding is fixed by bumping the module.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: ui
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

{{- if and ((.Values.decision).token).audience .Values.jevSecret }}
{{- fail "decision.token.audience and jevSecret both fill the Authorization header of the decision calls: set jevSecret to \"\" to send the projected ServiceAccount token, or leave decision.token.audience empty to send the key" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ego.name" . }}
  labels:
    {{- include "ego.labels" . | nindent 4 }}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "ego.name" . }}
  template:
    metadata:
      labels:
        {{- include "ego.labels" . | nindent 8 }}
      {{- if .Values.online.enabled }}
      annotations:
        # Restart on a profile change: the config is read once at startup.
        checksum/online: {{ include "ego.onlineConfig" . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The app never calls the Kubernetes API; GKE Workload Identity and the projected webhook token do not
      # need the automounted token either.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "ego.name" . }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - serve
            - --addr=:8001
            - --otlp-addr=:4318
            - --otlp-grpc-addr=:4317
            - --health-addr=:9090
            {{- with .Values.auth.defaultRole }}
            - --default-role={{ . }}
            {{- end }}
            {{- if not .Values.auth.enabled }}
            {{- if and .Values.httpRoute.enabled (not .Values.auth.allowOpenRoute) }}
            {{- fail "auth.enabled=false makes every caller an admin; with httpRoute.enabled=true that publishes the admin API. Set auth.allowOpenRoute=true if the route is meant to be open." }}
            {{- end }}
            - --no-auth
            {{- end }}
            {{- with .Values.logLevel }}
            - --log-level={{ . }}
            {{- end }}
            {{- if .Values.auth.auditLog }}
            - --audit-log
            {{- end }}
            - --session-db=/data/{{ .Values.persistence.dbFile }}
            - --session-memory={{ .Values.persistence.memorySessions }}
            - --session-retention={{ .Values.persistence.retention }}
            - --archive-alert-percent={{ .Values.persistence.alertPercent }}
            {{- with .Values.usageTenantAttr }}
            - --usage-tenant-attr={{ . }}
            {{- end }}
            {{- with .Values.adminGithubUsers }}
            - --admin-github-users={{ join "," . }}
            {{- end }}
            {{- if .Values.online.enabled }}
            - --online-config=/etc/ego/online.json
            {{- end }}
          env:
            {{- if .Values.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
            {{- end }}
            {{- if .Values.otlpAuth.enabled }}
            - name: EGO_OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpAuth.secret }}
                  key: {{ .Values.otlpAuth.key | default "OTLP_TOKEN" }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: EGO_GITHUB_CLIENT_ID
              value: {{ .Values.auth.githubClientId | quote }}
            - name: EGO_GITHUB_ORG
              value: {{ .Values.auth.githubOrg | quote }}
            - name: EGO_PUBLIC_URL
              value: {{ .Values.auth.publicUrl | quote }}
            - name: EGO_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.githubClientSecret }}
                  key: GITHUB_CLIENT_SECRET
            - name: EGO_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.sessionSecret }}
                  key: SESSION_SECRET
            {{- end }}
            {{- if .Values.vertex.enabled }}
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.vertex.project | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.vertex.location | quote }}
            {{- with .Values.vertex.judgeLocation }}
            - name: EGO_JUDGE_LOCATION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.decision.url }}
            - name: EGO_DECISION_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.decision.model }}
            - name: EGO_DECISION_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.decision.maxStateBytes }}
            - name: EGO_DECISION_MAX_STATE_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with ((.Values.decision).token).audience }}
            - name: EGO_DECISION_TOKEN_FILE
              value: /var/run/ego/decisions/token
            {{- end }}
            {{- with .Values.jevSecret }}
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: JEV_API_KEY
                  optional: true
            {{- end }}
            {{- if and .Values.online.enabled .Values.online.discordSecret }}
            - name: EGO_DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.online.discordSecret }}
                  key: DISCORD_WEBHOOK_URL
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8001
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 9090
          # A start that migrates a large archive can take minutes, and the health listener answers only once the
          # archive is loaded: the other probes wait for this one, so a slow start is not a failed one.
          startupProbe:
            httpGet:
              path: /api/health
              port: health
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: session-db
              mountPath: /data
            # The root filesystem is read-only; uploads spill to temp files here.
            - name: tmp
              mountPath: /tmp
            {{- if ((.Values.decision).token).audience }}
            - name: decisions-token
              mountPath: /var/run/ego/decisions
              readOnly: true
            {{- end }}
            {{- if .Values.online.enabled }}
            - name: online-config
              mountPath: /etc/ego
              readOnly: true
            {{- if .Values.online.webhookToken.enabled }}
            - name: webhook-token
              mountPath: /var/run/secrets/ego/webhook
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: session-db
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- with (.Values.decision).token }}
        {{- if .audience }}
        # Projected ServiceAccount token for the decision-model gateway (EGO_DECISION_TOKEN_FILE); the kubelet rotates
        # it and the client reads it on every call.
        - name: decisions-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .audience | quote }}
                  expirationSeconds: {{ .expirationSeconds | default 3600 }}
                  path: token
        {{- end }}
        {{- end }}
        {{- if .Values.online.enabled }}
        - name: online-config
          configMap:
            name: {{ include "ego.name" . }}-online
        {{- if .Values.online.webhookToken.enabled }}
        # Projected service-account token for the webhook sink
        # (bearerTokenFile: /var/run/secrets/ego/webhook/token); the
        # kubelet rotates it and the sink reads it on every send.
        - name: webhook-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "online.webhookToken.audience is required" .Values.online.webhookToken.audience }}
                  expirationSeconds: 3600
        {{- end }}
        {{- end }}

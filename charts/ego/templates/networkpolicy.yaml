{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ego.name" . }}
  labels:
    {{- include "ego.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "ego.name" . }}
  policyTypes: [Ingress]
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
{{- end }}
